name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.5.3"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install mdBook required by integration tests
        run: cargo install mdbook --version "$MDBOOK_VERSION" --locked

      - name: Install tmux 3.4
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          tmux_version="$(tmux -V)"
          printf '%s\n' "$tmux_version"
          test "$tmux_version" = "tmux 3.4"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run full test suite
        run: cargo test --all-targets --all-features --locked

      - name: Build Rust documentation
        run: cargo doc --all-features --locked --no-deps

      - name: Package crate
        run: cargo package --locked
